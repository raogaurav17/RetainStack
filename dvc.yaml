stages:
  data_ingestion:
    cmd: python -m src.data_ingestion
    deps:
      - data/raw_data.csv
      - src/data_ingestion.py
      - src/config.py
      - src/utils.py

    outs:
      - data/test_data.csv
      - data/train_data.csv

  data_drift:
    cmd: python -m src.data_drift
    deps:
      - data/train_data.csv
      - data/test_data.csv
      - src/data_drift.py
      - src/config.py
      - src/utils.py
    outs:
      - data/artifact/data_drift_report.html
      - data/artifact/data_drift_report.json

  data_preprocessing:
    cmd: python -m src.data_preprocessing
    deps:
      - data/train_data.csv
      - data/test_data.csv
      - src/data_preprocessing.py
      - src/config.py
      - src/utils.py
    params:
      - data_preprocess
    outs:
      - data/processed/x_train.csv
      - data/processed/y_train.csv
      - data/processed/x_val.csv
      - data/processed/y_val.csv
      - data/processed/x_test.csv
      - data/processed/y_test.csv
      - data/artifact/preprocessor.skops

  train:
    cmd: python -m src.train
    deps:
      - data/processed/x_train.csv
      - data/processed/y_train.csv
      - data/processed/x_val.csv
      - data/processed/y_val.csv
      - src/train.py
      - src/config.py
      - src/utils.py
      - src/models

    params:
      - train
    outs:
      - data/artifact/model.skops
      - data/artifact/run_id.txt

  evaluate:
    cmd: python -m src.evaluate
    deps:
      - data/processed/x_test.csv
      - data/processed/y_test.csv
      - data/artifact/model.skops
      - data/artifact/run_id.txt
      - src/evaluate.py
      - src/config.py
      - src/utils.py
    metrics:
      - data/artifact/evaluation_metrics.json:
          cache: false