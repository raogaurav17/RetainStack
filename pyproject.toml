[project]
name = "retainstack"
version = "0.1.0"
description = "end-to-end MLOps pipeline for predicting online customer purchase intent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dvc[s3]>=3.67.1",
    "fastapi>=0.136.3",
    "mlflow>=3.13.0",
    "pandas>=2.3.3",
    "protobuf>=4.25.9",
    "scikit-learn>=1.9.0",
    "setuptools>=82.0.1",
    "skops>=0.14.0",
    "uvicorn>=0.49.0",
    "xgboost>=3.2.0",
]
